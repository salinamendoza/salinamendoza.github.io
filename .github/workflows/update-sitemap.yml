name: Update Sitemap and Notify Google

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Generate sitemap
      run: |
        echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
        echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
        echo '  <url>' >> sitemap.xml
        echo '    <loc>https://salinamendoza.github.io/</loc>' >> sitemap.xml
        echo '    <changefreq>monthly</changefreq>' >> sitemap.xml
        echo '    <priority>1.0</priority>' >> sitemap.xml
        echo '  </url>' >> sitemap.xml
        echo '  <url>' >> sitemap.xml
        echo '    <loc>https://salinamendoza.github.io/blog/</loc>' >> sitemap.xml
        echo '    <changefreq>weekly</changefreq>' >> sitemap.xml
        echo '    <priority>0.8</priority>' >> sitemap.xml
        echo '  </url>' >> sitemap.xml
        
        # Find all HTML files in blog directory and add to sitemap
        find blog -name "*.html" ! -name "index.html" | while read file; do
          url="https://salinamendoza.github.io/$file"
          echo '  <url>' >> sitemap.xml
          echo "    <loc>$url</loc>" >> sitemap.xml
          echo '    <changefreq>monthly</changefreq>' >> sitemap.xml
          echo '    <priority>0.6</priority>' >> sitemap.xml
          echo '  </url>' >> sitemap.xml
        done
        
        echo '</urlset>' >> sitemap.xml
        
    - name: Commit sitemap
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sitemap.xml
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update sitemap"
        git push
        
    - name: Ping Google
      run: |
        curl "https://www.google.com/ping?sitemap=https://salinamendoza.github.io/sitemap.xml"
